[project]
name = "spume-sim"
version = "0.3.0"
description = "Spume: a GPU liquid solver (NVIDIA Warp): FLIP, whitewater, marching cubes, frame-sequence export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["warp-lang>=1.12", "numpy", "psutil", "pillow"]

[project.scripts]
spume = "spume.cli:main"

[project.urls]
Repository = "https://github.com/codepawl/spume"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
